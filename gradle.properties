# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# https://docs.gradle.org/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# https://docs.gradle.org/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Kotlin incremental compilation
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# AndroidX
android.enableJetifier=true
android.useAndroidX=true

# Build cache
android.buildCache=true

# Configure on demand
org.gradle.configureondemand=true

# Version constants
agpVersion=8.4.0
kotlinVersion=1.9.22
composeCompilerVersion=1.5.12
composeBomVersion=2024.02.00
coreKtxVersion=1.12.0
activityComposeVersion=1.8.2
material3Version=1.1.2
lifecycleVersion=2.7.0
coroutinesVersion=1.7.3
kotlinxSerializationVersion=1.6.1